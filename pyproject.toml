[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "lungct-kit"
version = "0.1.0"
description = "Leakage-safe loaders, preprocessing and splits for public lung CT nodule datasets (LUNA16, LUNA25)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Resham Raj Shivwanshi" }]
keywords = ["medical imaging", "lung nodule", "CT", "LUNA16", "LUNA25", "deep learning", "dataset"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
io = ["SimpleITK>=2.3"]
dev = ["SimpleITK>=2.3", "pytest>=8", "ruff>=0.6"]

[project.scripts]
lungct = "lungct_kit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lungct_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
